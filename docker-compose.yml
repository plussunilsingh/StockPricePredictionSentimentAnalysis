services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.slim
    image: stock-prediction-enterprise:slim
    environment:
      - PORT=7860        # Streamlit external port inside the container
      - BACKEND_PORT=8000
    ports:
      - "8005:7860"   # Map host 8005 to container 7860 for Streamlit UI (avoids conflicts)
      - "8000:8000"   # Backend (optional, internal) - map if you want direct access
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data:ro
      - ./wheelhouse:/app/wheelhouse:ro
    restart: unless-stopped
    stdin_open: false
    tty: false
    healthcheck:
      test: ["CMD", "/app/healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s

# Use 'docker compose up --build' to build and run the single container which
# launches the backend (uvicorn) and the frontend (Streamlit) inside the same image.
