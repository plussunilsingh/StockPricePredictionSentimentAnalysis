# System Configuration
system:
  dataMode: "MOCK" # MOCK or LIVE
  port: 8000
  logFile: "backend.log"

# Model Settings
models:
  lstmPath: "data/model.h5"
  rfPath: "data/rf_model.joblib"
  defaultModel: "RF"
  sequenceLength: 10

# Security Symbols
symbols:
  indices:
    - { label: "NIFTY 50 (NSEI)", value: "NSEI" }
    - { label: "SENSEX (BSESN)", value: "BSESN" }
    - { label: "NIFTY BANK", value: "NSEBANK" }
    - { label: "NIFTY IT", value: "CNXIT" }
  stocks:
    - { label: "Apple (AAPL)", value: "AAPL" }
    - { label: "Microsoft (MSFT)", value: "MSFT" }
    - { label: "Google (GOOGL)", value: "GOOGL" }

# Data Fetching
data:
  mockDir: "data"
  historicalDays: 180
  predictionWindow: 40
